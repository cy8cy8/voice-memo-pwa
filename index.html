<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#000">
    <meta name="mobile-web-app-capable" content="yes">
    <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
    <link rel="manifest" href="manifest.json">
    <title>Voice Memo</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app">
        <header class="header">
            <h1>Voice Memo</h1>
            <span class="memo-count" id="memoCount">
                0 memos
            </span>
        </header>
        <main class="main">
            <section class="recorder-section">
                <div class="timer" id="timer">0:00</div>
                <button class="record-btn" id="recordBtn">REC</button>
            </section>
            <section class="memos-section">
                <div class="memos-list" id="memosList"></div>
                <div class="empty-state" id="emptyState"></div>
            </section>
        </main>
    </div>
    <script src="app.js"></script>
</body>
</html>
